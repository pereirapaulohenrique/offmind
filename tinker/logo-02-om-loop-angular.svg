<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="teal-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Angular 2B: O-wraps-M with sharp geometric angles, circuit board monogram -->
  <!-- Angular O-shape wraps around an angular M -->
  <path d="
    M 140 35
    L 165 35
    L 165 100
    L 165 165
    L 100 165
    L 35 165
    L 35 100
    L 35 35
    L 100 35
    L 120 35
  " fill="none" stroke="url(#teal-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- M inside the angular container -->
  <path d="
    M 60 140
    L 60 75
    L 100 105
    L 140 75
    L 140 140
  " fill="none" stroke="url(#teal-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>