<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Three stacked lines (todo list), top line floating up and fading -->
  <!-- Bottom line — solid, grounded -->
  <line
    x1="50" y1="135"
    x2="150" y2="135"
    stroke="url(#teal-grad)"
    stroke-width="14"
    stroke-linecap="round"
  />
  <!-- Middle line — solid -->
  <line
    x1="50" y1="105"
    x2="150" y2="105"
    stroke="url(#teal-grad)"
    stroke-width="14"
    stroke-linecap="round"
  />
  <!-- Top line — floating upward, fading out (released thought) -->
  <line
    x1="50" y1="65"
    x2="150" y2="65"
    stroke="url(#teal-grad)"
    stroke-width="14"
    stroke-linecap="round"
    opacity="0.35"
  />
</svg>
