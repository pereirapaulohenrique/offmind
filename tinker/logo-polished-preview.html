<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Polished Crystal Logo</title>
<style>
  body { margin: 0; font-family: system-ui; background: #09090b; color: #a1a1aa; padding: 48px; display: flex; flex-direction: column; align-items: center; gap: 40px; }
  h2 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #52525b; margin: 0 0 12px; }
  .row { display: flex; gap: 32px; align-items: end; }
  .card { padding: 20px; border-radius: 14px; text-align: center; }
  .dark { background: #09090b; border: 1px solid #27272a; }
  .light { background: #fafafa; border: 1px solid #e4e4e7; }
  .s span { font-size: 8px; display: block; margin-top: 5px; color: #3f3f46; }
  .nav { width: 540px; height: 46px; background: #09090b; border: 1px solid #27272a; border-radius: 10px; display: flex; align-items: center; padding: 0 16px; }
  .nav img { width: 24px; height: 24px; margin-right: 8px; }
  .nav .name { font-size: 14px; font-weight: 600; color: #fafafa; letter-spacing: -0.02em; }
  .nav .links { margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: 12px; color: #71717a; }
  .nav .cta { background: #14b8a6; color: #09090b; padding: 4px 10px; border-radius: 5px; font-weight: 500; }
</style>
</head>
<body>

  <h2>On Dark</h2>
  <div class="row">
    <div class="card dark s"><img src="logo-polished.svg" width="180" height="180"><span>180</span></div>
    <div class="card dark s"><img src="logo-polished.svg" width="96" height="96"><span>96</span></div>
    <div class="card dark s"><img src="logo-polished.svg" width="48" height="48"><span>48</span></div>
    <div class="card dark s"><img src="logo-polished.svg" width="32" height="32"><span>32</span></div>
    <div class="card dark s"><img src="logo-polished.svg" width="20" height="20"><span>20</span></div>
    <div class="card dark s"><img src="logo-polished.svg" width="16" height="16"><span>16</span></div>
  </div>

  <h2>On Light</h2>
  <div class="row">
    <div class="card light s"><img src="logo-polished.svg" width="180" height="180"><span>180</span></div>
    <div class="card light s"><img src="logo-polished.svg" width="48" height="48"><span>48</span></div>
    <div class="card light s"><img src="logo-polished.svg" width="16" height="16"><span>16</span></div>
  </div>

  <h2>Wordmark</h2>
  <div class="row">
    <div class="card dark" style="display:flex;align-items:center;gap:10px;">
      <img src="logo-polished.svg" width="28" height="28">
      <span style="font-size:18px;font-weight:600;color:#fafafa;letter-spacing:-0.02em;">OffMind</span>
    </div>
    <div class="card light" style="display:flex;align-items:center;gap:10px;">
      <img src="logo-polished.svg" width="28" height="28">
      <span style="font-size:18px;font-weight:600;color:#18181b;letter-spacing:-0.02em;">OffMind</span>
    </div>
  </div>

  <h2>Navigation</h2>
  <div class="nav">
    <img src="logo-polished.svg">
    <span class="name">OffMind</span>
    <div class="links">How it works &nbsp; Pricing &nbsp; FAQ <span class="cta">Get Access</span></div>
  </div>

</body>
</html>
