<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100">
  <defs>
    <style>
      @import url('https://api.fontshare.com/v2/css?f[]=satoshi@700&amp;display=swap');
    </style>
    <linearGradient id="o-bold" gradientUnits="userSpaceOnUse" x1="14" y1="38" x2="40" y2="70">
      <stop offset="0" stop-color="#5eebb8"/>
      <stop offset="1" stop-color="#0d9478"/>
    </linearGradient>
  </defs>

  <!--
    Bold variant — Satoshi Bold 700 at 48px
    Heavier stroke, more presence like the "Forest" reference
    The loop is bolder, more confident, immediately noticeable

    Stem width at Bold 700: ~6.5px
    x-height: ~29px
    Baseline: y=68
  -->

  <!-- Open loop "o" — bolder, more geometric, committed -->
  <path
    d="M 32 40
       A 13 14.5 0 1 0 35.5 44.5"
    fill="none"
    stroke="url(#o-bold)"
    stroke-width="6.5"
    stroke-linecap="round"
  />

  <text
    x="42" y="68"
    font-family="'Satoshi', 'Inter', 'Geist Sans', sans-serif"
    font-weight="700"
    font-size="48"
    letter-spacing="0.5"
    fill="#fafafa"
  >ffmind</text>
</svg>
