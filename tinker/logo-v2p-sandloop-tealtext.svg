<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100">
  <defs>
    <style>
      @import url('https://api.fontshare.com/v2/css?f[]=satoshi@500&amp;display=swap');
    </style>
    <linearGradient id="o-sandl" gradientUnits="userSpaceOnUse" x1="14" y1="38" x2="40" y2="72">
      <stop offset="0" stop-color="#e8dcc8"/>
