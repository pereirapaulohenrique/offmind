<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="teal-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="teal-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="teal-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Origami M: three triangular facets forming the letter M -->
  <!-- Each facet is a different teal shade for depth -->

  <!-- Left leg of M: triangle facet (lightest teal) -->
  <path d="M 32 156 L 56 44 L 80 156 Z"
        fill="url(#teal-light)" stroke="none"/>

  <!-- Center V of M: triangle facet (mid teal) -->
  <path d="M 80 156 L 100 90 L 120 156 Z"
        fill="url(#teal-mid)" stroke="none"/>

  <!-- Right leg of M: triangle facet (darkest teal) -->
  <path d="M 120 156 L 144 44 L 168 156 Z"
        fill="url(#teal-dark)" stroke="none"/>

  <!-- Fold lines for origami effect -->
  <line x1="56" y1="44" x2="80" y2="156" stroke="#0d9488" stroke-width="2" opacity="0.5"/>
  <line x1="144" y1="44" x2="120" y2="156" stroke="#0d9488" stroke-width="2" opacity="0.5"/>
</svg>