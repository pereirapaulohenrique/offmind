<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="teal-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Abstract thought bubble opening/dissolving at top. Dot inside = the thought. -->
  <!-- Bubble = your mind, the opening at top = OffMind releasing it -->
  <!-- Thought bubble body with opening at top -->
  <path d="
    M 120 35
    A 70 65 0 0 0 40 80
    A 70 70 0 0 0 55 150
    L 65 165
    L 80 148
    A 70 65 0 0 0 160 80
    A 70 65 0 0 0 135 38
  " fill="none" stroke="url(#teal-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dissolving particles escaping from the gap at top -->
  <circle cx="127" cy="28" r="4" fill="#2dd4bf"/>
  <circle cx="118" cy="20" r="3" fill="#5eead4"/>
  <circle cx="135" cy="22" r="2.5" fill="#14b8a6"/>
  <!-- The thought (single dot inside the bubble) -->
  <circle cx="100" cy="95" r="10" fill="url(#teal-grad)"/>
</svg>