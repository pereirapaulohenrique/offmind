<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100">
  <defs>
    <style>
      @import url('https://api.fontshare.com/v2/css?f[]=satoshi@500,700&amp;display=swap');
    </style>
    <linearGradient id="o-v3" gradientUnits="userSpaceOnUse" x1="14" y1="38" x2="40" y2="72">
      <stop offset="0" stop-color="#5eebb8"/>
      <stop offset="1" stop-color="#0d9478"/>
    </linearGradient>
  </defs>

  <!--
    V3 Weight Contrast — "off" bold + "mind" medium
    Loop matches Bold 700 stem width (~6.5px at 48px)
    Gap at upper-right, tight (~30°), reads clearly as "o"

    Satoshi Bold 700 at 48px:
    - Baseline: y=68
    - x-height: ~29px → top at y=39
    - Stem width: ~6.5px
    - "o" inner: rx≈10, ry≈11 (counter)
    - "o" outer: rx≈16.5, ry≈17.5 (with stroke simulating filled letter)

    Using stroke-width=6.5 with rx=12, ry=13.5 to get
    outer edge at ~18.5 and inner edge at ~5.5 — approximating bold "o"
  -->

  <!-- Open loop "o" — bold weight, tight upper-right gap -->
  <path
    d="M 30 41
       A 12 13.5 0 1 0 34.5 44"
    fill="none"
    stroke="url(#o-v3)"
    stroke-width="6.5"
    stroke-linecap="round"
  />

  <!-- "ff" in Bold to match the loop weight -->
  <text
    x="40" y="68"
    font-family="'Satoshi', 'Inter', 'Geist Sans', sans-serif"
    font-weight="700"
    font-size="48"
    letter-spacing="0.5"
    fill="#fafafa"
  >ff</text>

  <!-- "mind" in Medium — lighter, receding -->
  <text
    x="82" y="68"
    font-family="'Satoshi', 'Inter', 'Geist Sans', sans-serif"
    font-weight="500"
    font-size="48"
    letter-spacing="0.5"
    fill="#fafafa"
  >mind</text>
</svg>
