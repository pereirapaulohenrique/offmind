<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="settle-grad" gradientUnits="userSpaceOnUse" x1="50" y1="10" x2="50" y2="85">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Scattered dots at top -->
  <circle cx="30" cy="18" r="6" fill="#5eead4" opacity="0.35"/>
  <circle cx="56" cy="12" r="6" fill="#5eead4" opacity="0.45"/>
  <circle cx="76" cy="22" r="6" fill="#5eead4" opacity="0.55"/>
  <!-- Converging mid dots -->
  <circle cx="38" cy="46" r="6.5" fill="#2dd4bf" opacity="0.65"/>
  <circle cx="62" cy="42" r="6.5" fill="#2dd4bf" opacity="0.75"/>
  <!-- Settled unified shape at bottom -->
  <ellipse cx="50" cy="76" rx="20" ry="12" fill="url(#settle-grad)"/>
</svg>
