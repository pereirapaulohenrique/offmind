<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100">
  <defs>
    <style>
      @import url('https://api.fontshare.com/v2/css?f[]=satoshi@500&amp;display=swap');
    </style>
    <linearGradient id="o-grad" gradientUnits="userSpaceOnUse" x1="38" y1="30" x2="10" y2="65">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Open Loop as the "o" — sized to match Satoshi x-height -->
  <!-- Center at (24, 52), rx=19 ry=18, gap at upper-right -->
  <path
    d="M 37.5 39
       A 19 18 0 1 0 42 47"
    fill="none"
    stroke="url(#o-grad)"
    stroke-width="5.5"
    stroke-linecap="round"
  />

  <!-- "ffmind" following the loop-o -->
  <text
    x="52" y="70"
    font-family="'Satoshi', 'Inter', 'Geist Sans', sans-serif"
    font-weight="500"
    font-size="52"
    letter-spacing="1"
    fill="#fafafa"
  >ffmind</text>
</svg>
