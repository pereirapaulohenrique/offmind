<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="teal-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Refined 2B: Continuous stroke. O wraps around M, gap at top-right = release -->
  <!-- The path starts at the gap, sweeps a large arc all the way around, then becomes the M -->
  <!-- Arc: starts top-right gap, sweeps counter-clockwise around to bottom-left, enters M's left leg -->
  <path d="
    M 152 62
    A 68 68 0 1 0 56 140
    L 56 78
    L 100 112
    L 144 78
    L 144 140
  " fill="none" stroke="url(#teal-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>