<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Spiral tightening from outside-in, STOPS before center -->
  <!-- The break = mind doesn't spiral endlessly. OffMind breaks the spiral. -->
  <!-- Archimedean spiral approximated with cubic beziers -->
  <path
    d="M 170,100
       C 170,140 145,170 100,170
       C 55,170 35,140 35,100
       C 35,65 55,42 90,42
       C 125,42 145,65 145,95
       C 145,120 130,140 105,140
       C 80,140 62,120 62,100
       C 62,80 75,65 95,65
       C 112,65 125,78 125,95
       C 125,108 115,118 104,118"
    fill="none"
    stroke="url(#teal-grad)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
