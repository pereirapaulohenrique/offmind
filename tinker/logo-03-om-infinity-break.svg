<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="teal-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Infinity shape with O on left lobe, M zigzag on right lobe, break at top-center crossing -->
  <!-- Left lobe (O): from center-bottom, curves left and back to center-top -->
  <path d="
    M 100 108
    C 80 145, 25 145, 25 100
    C 25 55, 80 55, 100 92
  " fill="none" stroke="url(#teal-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right lobe (M-shaped): from center-bottom, zigzags right forming M peaks, gap before reconnecting -->
  <path d="
    M 100 116
    C 115 145, 140 145, 150 125
    L 163 100
    L 150 75
    L 137 100
    L 124 75
    C 115 60, 105 65, 100 84
  " fill="none" stroke="url(#teal-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>