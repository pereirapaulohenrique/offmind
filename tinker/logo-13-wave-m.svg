<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- M formed by a smooth sine wave — two peaks = two strokes of M -->
  <!-- Brain wave / thought pattern aesthetic -->
  <path
    d="M 25,130
       C 25,130 40,130 50,130
       C 60,130 65,50 80,50
       C 95,50 95,130 100,130
       C 105,130 105,50 120,50
       C 135,50 140,130 150,130
       C 160,130 175,130 175,130"
    fill="none"
    stroke="url(#teal-grad)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
