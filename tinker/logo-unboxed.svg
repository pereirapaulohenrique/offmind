<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="unbox-grad" gradientUnits="userSpaceOnUse" x1="15" y1="85" x2="85" y2="15">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <!-- Concept 6: The Unboxed
       Notion = N in a closed cube.
       OffMind = the box is dissolving / opening.

       A rounded rectangle with its corners breaking apart —
       the four corners pulling away from each other,
       creating openings. The structure is letting go.
       Content is free. No containment.

       Four corner fragments, each a quarter-arc,
       separated by gaps. The "box" exists as suggestion
       but is fundamentally open.
  -->

  <!-- Top-left corner arc -->
  <path
    d="M 18 38 L 18 26 C 18 20, 20 18, 26 18 L 38 18"
    fill="none" stroke="url(#unbox-grad)" stroke-width="6" stroke-linecap="round"
  />

  <!-- Top-right corner arc -->
  <path
    d="M 62 18 L 74 18 C 80 18, 82 20, 82 26 L 82 38"
    fill="none" stroke="url(#unbox-grad)" stroke-width="6" stroke-linecap="round"
  />

  <!-- Bottom-right corner arc -->
  <path
    d="M 82 62 L 82 74 C 82 80, 80 82, 74 82 L 62 82"
    fill="none" stroke="url(#unbox-grad)" stroke-width="6" stroke-linecap="round"
  />

  <!-- Bottom-left corner arc -->
  <path
    d="M 38 82 L 26 82 C 20 82, 18 80, 18 74 L 18 62"
    fill="none" stroke="url(#unbox-grad)" stroke-width="6" stroke-linecap="round"
  />
</svg>
