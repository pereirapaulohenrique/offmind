<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OffMind Command Center</title>
<style>
  :root {
    --zinc-50:#fafafa;--zinc-100:#f4f4f5;--zinc-200:#e4e4e7;
    --zinc-300:#d4d4d8;--zinc-400:#a1a1aa;--zinc-500:#71717a;
    --zinc-600:#52525b;--zinc-700:#3f3f46;--zinc-800:#27272a;
    --zinc-850:#1e1e22;--zinc-900:#18181b;--zinc-950:#09090b;
    --teal-400:#2dd4bf;--teal-500:#14b8a6;--teal-600:#0d9488;
    --teal-700:#0f766e;--teal-900:#134e4a;
    --amber-400:#fbbf24;--amber-500:#f59e0b;
    --red-400:#f87171;--red-500:#ef4444;
    --orange-400:#fb923c;--orange-500:#f97316;
    --yellow-400:#facc15;--green-400:#4ade80;--green-500:#22c55e;
    --purple-400:#c084fc;--blue-400:#60a5fa;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--zinc-950);color:var(--zinc-200);min-height:100vh;line-height:1.5}

  /* Header */
  .header{background:linear-gradient(135deg,var(--zinc-900),var(--zinc-850));border-bottom:1px solid var(--zinc-800);padding:20px 28px;position:sticky;top:0;z-index:100}
  .header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .header h1{font-size:22px;font-weight:700;color:var(--zinc-50);display:flex;align-items:center;gap:10px}
  .header h1 .logo{width:26px;height:26px;background:var(--teal-500);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--zinc-950)}
  .meta{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--zinc-500)}

  /* Overall progress */
  .overall-progress{margin-top:14px;display:flex;align-items:center;gap:12px}
  .bar-bg{flex:1;height:8px;background:var(--zinc-800);border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;transition:width 0.4s ease}
  .overall-progress .bar-fill{background:linear-gradient(90deg,var(--teal-600),var(--teal-400))}
  .pct{font-size:14px;font-weight:600;color:var(--teal-400);min-width:48px;text-align:right}

  /* Tier stats row */
  .tier-stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .tier-stat{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid var(--zinc-800);display:flex;align-items:center;gap:6px;cursor:default}
  .tier-stat .dot{width:8px;height:8px;border-radius:50%}

  /* Filters */
  .filters{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
  .filter-btn{padding:4px 10px;font-size:11px;border-radius:6px;border:1px solid var(--zinc-700);background:transparent;color:var(--zinc-400);cursor:pointer;transition:all 0.15s;font-family:inherit}
  .filter-btn:hover{border-color:var(--zinc-500);color:var(--zinc-200)}
  .filter-btn.active{background:var(--teal-900);border-color:var(--teal-600);color:var(--teal-400)}
  .filter-group{display:flex;gap:4px;align-items:center}
  .filter-label{font-size:10px;color:var(--zinc-600);text-transform:uppercase;letter-spacing:0.5px;margin-right:4px;font-weight:600}
  .filter-sep{width:1px;height:18px;background:var(--zinc-800);margin:0 6px}

  /* Tiers container */
  .tiers{max-width:1200px;margin:0 auto;padding:20px 28px}

  /* Tier */
  .tier{background:var(--zinc-900);border:1px solid var(--zinc-800);border-radius:12px;margin-bottom:16px;overflow:hidden}
  .tier-header{padding:14px 18px;border-bottom:1px solid var(--zinc-800);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
  .tier-header:hover{background:var(--zinc-850)}
  .tier-title{font-size:15px;font-weight:700;color:var(--zinc-50);display:flex;align-items:center;gap:8px}
  .tier-title .icon{font-size:16px}
  .tier-right{display:flex;align-items:center;gap:10px}
  .tier-progress{display:flex;align-items:center;gap:8px;min-width:160px}
  .tier-progress .bar-bg{height:6px}
  .tier-progress .stats{font-size:12px;color:var(--zinc-500);min-width:44px;text-align:right}
  .chevron{font-size:11px;color:var(--zinc-600);transition:transform 0.2s}
  .tier.collapsed .chevron{transform:rotate(-90deg)}
  .tier.collapsed .tier-body{display:none}

  /* Sections within tiers */
  .section{border-bottom:1px solid var(--zinc-850)}
  .section:last-child{border-bottom:none}
  .section-header{display:flex;align-items:center;justify-content:space-between;padding:8px 18px;cursor:pointer;user-select:none}
  .section-header:hover{background:rgba(255,255,255,0.02)}
  .section-label{font-size:11px;font-weight:600;color:var(--zinc-500);text-transform:uppercase;letter-spacing:0.5px}
  .section-count{font-size:11px;color:var(--zinc-600)}
  .section.collapsed .section-items{display:none}
  .section .chevron{font-size:10px}

  /* Items */
  .section-items{padding:0 10px 6px}
  .item{display:flex;align-items:flex-start;gap:10px;padding:7px 8px;border-radius:8px;transition:background 0.15s}
  .item:hover{background:var(--zinc-850)}
  .item.hidden{display:none}

  .item input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:17px;height:17px;min-width:17px;border:2px solid var(--zinc-600);border-radius:4px;cursor:pointer;position:relative;top:2px;transition:all 0.15s;background:transparent}
  .item input[type="checkbox"]:hover{border-color:var(--teal-500)}
  .item input[type="checkbox"]:checked{background:var(--teal-500);border-color:var(--teal-500)}
  .item input[type="checkbox"]:checked::after{content:'';position:absolute;left:3px;top:0px;width:6px;height:10px;border:solid var(--zinc-950);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .item-content{flex:1;min-width:0}
  .item-title{font-size:13px;color:var(--zinc-200);line-height:1.4}
  .item.done .item-title{color:var(--zinc-600);text-decoration:line-through}
  .item-meta{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap;align-items:center}

  .badge{font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:0.3px}
  .badge-claude{background:var(--teal-900);color:var(--teal-400)}
  .badge-paulo{background:rgba(251,191,36,0.15);color:var(--amber-400)}
  .badge-both{background:rgba(168,85,247,0.15);color:var(--purple-400)}
  .badge-blocked{background:rgba(239,68,68,0.15);color:var(--red-400)}
  .badge-done{background:rgba(34,197,94,0.15);color:var(--green-400)}
  .item-id{font-size:9px;color:var(--zinc-600);font-family:'SF Mono',Monaco,monospace}
  .item-note{font-size:11px;color:var(--zinc-600);font-style:italic;margin-top:2px}

  /* Responsive */
  @media(max-width:768px){.header{padding:14px}.tiers{padding:14px}.filters{gap:4px}.filter-sep{display:none}.tier-progress{min-width:100px}}
  @media print{body{background:#fff;color:#000}.header{position:static;background:#fff;border-bottom:2px solid #ccc}.tier{border:1px solid #ccc;break-inside:avoid}.filters,.tier-stats{display:none}}
</style>

        {id:'MKT-131',title:'Consider X Premium (if X is converting)',owner:'paulo',done:false},
        {id:'MKT-132',title:'Create Indie Hackers profile + post',owner:'paulo',done:false,note:'Only if gate passes'},
        {id:'MKT-133',title:'List on SaaSHub',owner:'paulo',done:false,note:'Only if gate passes'},
        {id:'MKT-134',title:'List on AlternativeTo',owner:'paulo',done:false,note:'Only if gate passes'},
        {id:'MKT-135',title:'Create lead magnet: Compound Thinking Starter Kit',owner:'both',done:false,note:'Only if email channel works'},
        {id:'MKT-136',title:'Weekly review of all metrics',owner:'both',done:false},
      ]},
      { label:'Kill Criteria & Gates', items:[
        {id:'MKT-140',title:'KILL: 0 customers after Day 14 \u2192 rewrite positioning',owner:'both',done:false,note:'Do NOT scale, pivot messaging'},
        {id:'MKT-141',title:'KILL: < $200 revenue after Day 30 \u2192 fundamental pivot',owner:'both',done:false,note:'Product, pricing, or audience change'},
        {id:'MKT-142',title:'Product Hunt / Show HN only after gate passes',owner:'both',done:false,note:'Requires: 5+ customers, 1+ testimonial, working checkout'},
      ]},
    ]
  },
];

const LS_KEY='offmind-cc-v2';
const LS_COLLAPSE='offmind-cc-v2-collapse';

function loadState(){try{return JSON.parse(localStorage.getItem(LS_KEY))||{}}catch{return{}}}
function saveState(s){localStorage.setItem(LS_KEY,JSON.stringify(s))}
function loadCollapsed(){try{return JSON.parse(localStorage.getItem(LS_COLLAPSE))||{}}catch{return{}}}
function saveCollapsed(c){localStorage.setItem(LS_COLLAPSE,JSON.stringify(c))}
function getChecked(id,def){const s=loadState();return s[id]!==undefined?s[id]:def}
function setChecked(id,v){const s=loadState();s[id]=v;s['_lastUpdated']=new Date().toISOString();saveState(s)}

let filters={owner:'all',status:'all'};

function render(){
  const container=document.getElementById('tiers');
  container.innerHTML='';
  let totalItems=0,totalDone=0;
  const tierSummaries=[];

  DATA.forEach(tier=>{
    const el=document.createElement('div');
    el.className='tier';
    const collapsed=loadCollapsed();
    const tierCollapsed=collapsed['tier-'+tier.id]||false;
    if(tierCollapsed)el.classList.add('collapsed');

    let tItems=0,tDone=0;
    let sectionsHTML='';

    tier.sections.forEach((sec,si)=>{
      const secKey=tier.id+'-'+si;
      const secCollapsed=collapsed[secKey]||false;
      let sItems=0,sDone=0,itemsHTML='';

      sec.items.forEach(item=>{
        const done=getChecked(item.id,item.done);
        sItems++;tItems++;totalItems++;
        if(done){sDone++;tDone++;totalDone++}

        const ownerClass='badge-'+item.owner;
        const ownerLabel=item.owner==='both'?'Both':item.owner==='claude'?'Claude':'Paulo';
        let statusBadge='',statusClass='';
        if(done){statusBadge='<span class="badge badge-done">Done</span>';statusClass='done'}
        else if(item.blocked){statusBadge='<span class="badge badge-blocked">Blocked</span>'}

        let hidden=false;
        if(filters.owner!=='all'&&item.owner!==filters.owner)hidden=true;
        if(filters.status==='done'&&!done)hidden=true;
        if(filters.status==='open'&&done)hidden=true;
        if(filters.status==='blocked'&&!item.blocked)hidden=true;

        itemsHTML+=`<div class="item ${statusClass} ${hidden?'hidden':''}" data-id="${item.id}">
          <input type="checkbox" ${done?'checked':''} data-item-id="${item.id}" data-default="${item.done}">
          <div class="item-content">
            <div class="item-title">${item.title}</div>
            <div class="item-meta">
              <span class="item-id">${item.id}</span>
              <span class="badge ${ownerClass}">${ownerLabel}</span>
              ${statusBadge}
            </div>
            ${item.note?`<div class="item-note">${item.note}</div>`:''}
          </div>
        </div>`;
      });

      sectionsHTML+=`<div class="section ${secCollapsed?'collapsed':''}" data-section-key="${secKey}">
        <div class="section-header">
          <span class="section-label">${sec.label}</span>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="section-count">${sDone}/${sItems}</span>
            <span class="chevron">\u25BC</span>
          </div>
        </div>
        <div class="section-items">${itemsHTML}</div>
      </div>`;
    });

    const pct=tItems?Math.round((tDone/tItems)*100):0;
    tierSummaries.push({id:tier.id,title:tier.title,color:tier.color,done:tDone,total:tItems,pct});

    el.innerHTML=`<div class="tier-header" data-tier-id="${tier.id}">
      <div class="tier-title"><span class="icon">${tier.icon}</span>${tier.title}<span style="font-size:11px;font-weight:400;color:var(--zinc-500);margin-left:6px">${tier.desc}</span></div>
      <div class="tier-right">
        <div class="tier-progress">
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${tier.color}"></div></div>
          <span class="stats">${tDone}/${tItems}</span>
        </div>
        <span class="chevron">\u25BC</span>
      </div>
    </div>
    <div class="tier-body">${sectionsHTML}</div>`;
    container.appendChild(el);
  });

  // Overall
  const overallPct=totalItems?Math.round((totalDone/totalItems)*100):0;
  document.getElementById('overallBar').style.width=overallPct+'%';
  document.getElementById('overallPct').textContent=overallPct+'%';

  // Tier stats
  const statsEl=document.getElementById('tierStats');
  statsEl.innerHTML=tierSummaries.map(t=>`<div class="tier-stat"><span class="dot" style="background:${t.color}"></span>${t.done}/${t.total}</div>`).join('');

  // Timestamp
  const state=loadState();
  const lastUp=state['_lastUpdated'];
  document.getElementById('lastUpdated').textContent=lastUp?'Updated: '+new Date(lastUp).toLocaleString():'Updated: '+new Date().toLocaleString();

  // Bind checkboxes
  document.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
    cb.addEventListener('change',e=>{setChecked(e.target.dataset.itemId,e.target.checked);render()});
  });

  // Bind tier collapse
  document.querySelectorAll('.tier-header').forEach(th=>{
    th.addEventListener('click',()=>{
      const t=th.parentElement;const id='tier-'+th.dataset.tierId;
      const c=loadCollapsed();c[id]=!t.classList.contains('collapsed');saveCollapsed(c);
      t.classList.toggle('collapsed');
    });
  });

  // Bind section collapse
  document.querySelectorAll('.section-header').forEach(sh=>{
    sh.addEventListener('click',e=>{
      e.stopPropagation();
      const sec=sh.parentElement;const key=sec.dataset.sectionKey;
      const c=loadCollapsed();c[key]=!sec.classList.contains('collapsed');saveCollapsed(c);
      sec.classList.toggle('collapsed');
    });
  });
}

// Filters
document.getElementById('filters').addEventListener('click',e=>{
  const btn=e.target.closest('.filter-btn');if(!btn)return;
  const ft=btn.dataset.filter,val=btn.dataset.value;
  btn.parentElement.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filters[ft]=val;render();
});

render();
</script>
</body>
</html>
